# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quiz_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Serveur
server.port=8080

# IA (generation de questions) - Groq API (GRATUIT, sans carte bancaire)
# 1. Creer une cle sur https://console.groq.com/keys
# 2. Exporter la variable d'environnement : IA_API_KEY
# IMPORTANT : ne jamais committer une vraie cle en clair.
app.ia.api.key=${IA_API_KEY}
app.ia.api.url=https://api.groq.com/openai/v1/chat/completions
app.ia.model=llama-3.3-70b-versatile



